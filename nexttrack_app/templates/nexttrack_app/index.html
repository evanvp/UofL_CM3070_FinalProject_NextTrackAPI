{% extends 'nexttrack_app/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        {% for genre in genres %}
        <div class="col-6 col-md-4 col-lg-3 mb-4">
            <div class="card h-100 genre-card shadow-sm" 
                 onclick="window.location.href='{% url 'player_page' %}?genre={{ genre|urlencode }}'" 
                 style="cursor: pointer;">
                <div class="card-body text-center d-flex align-items-center justify-content-center">
                    <h5 class="card-title mb-0">{{ genre.title }}</h5>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <div class="alert alert-info">
                No genres found. Please ensure your track database is populated.
            </div>
        </div>
        {% endfor %}
    </div>
</div>


{% endblock %}
